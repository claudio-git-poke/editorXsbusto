<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor Cutscene - Sbusto</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
    body { background: #121212; color: #fff; padding: 20px; display: flex; gap: 20px; }

    #editor-container { flex: 1; max-width: 450px; background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #333; }
    #preview-container { flex: 1; display: flex; flex-direction: column; align-items: center; }

    h2, h3 { color: #9bbc0f; margin-bottom: 10px; }
    label { display: block; font-size: 11px; margin-top: 8px; color: #aaa; }
    input, select, button { width: 100%; padding: 8px; margin-top: 4px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; font-family: monospace; }
    button { background: #306230; color: #9bbc0f; cursor: pointer; font-weight: bold; margin-top: 12px; }
    button:hover { background: #408240; }
    .btn-danger { background: #8b0000; color: #fff; }
    .btn-secondary { background: #444; color: #fff; }

    /* CANVAS STAGE 400x300 1:1 */
    #stage {
      width: 400px;
      height: 300px;
      background: #000;
      border: 4px solid #9bbc0f;
      position: relative;
      overflow: hidden;
      background-size: cover;
      background-position: center;
    }

    .editor-actor {
      position: absolute;
      width: 48px;
      height: 48px;
      border: 1px dashed #00ff00;
      cursor: move;
      user-select: none;
      image-rendering: pixelated;
      object-fit: contain;
    }

    .actor-label {
      position: absolute;
      top: -12px;
      left: 0;
      background: rgba(0,0,0,0.8);
      color: #00ff00;
      font-size: 8px;
      padding: 1px 3px;
      white-space: nowrap;
    }

    .event-card { background: #2a2a2a; padding: 8px; border-radius: 4px; margin-top: 8px; border-left: 3px solid #9bbc0f; position: relative; }
    .event-card .remove-btn { position: absolute; top: 4px; right: 4px; width: auto; padding: 2px 6px; font-size: 9px; }
  </style>
</head>
<body>

  <!-- PANNELLO CONTROLLI -->
  <div id="editor-container">
    <h2>EDITOR CUTSCENE</h2>
    
    <button onclick="saveCutscene()" style="background: #9bbc0f; color: #0f380f; font-size: 14px; margin-bottom: 15px;">💾 SALVA PER IL GIORNO...</button>

    <h3>1. IMPOSTAZIONI SCENA</h3>
    <label>SFONDO (Nome file su Supabase):</label>
    <input type="text" id="cfg-bg" placeholder="es. bg_bosco.png" onchange="updateStageConfig()">
    
    <label>MUSICA (Nome file su Supabase):</label>
    <input type="text" id="cfg-music" placeholder="es. music_intro.mp3" onchange="updateStageConfig()">

    <h3 style="margin-top: 15px;">2. ATTORI (Sposta col mouse sul Canvas)</h3>
    <div id="actors-list"></div>
    <button onclick="addActor()" class="btn-secondary">+ AGGIUNGI ATTORE</button>

    <h3 style="margin-top: 15px;">3. EVENTI TIMELINE</h3>
    <div id="events-list"></div>
    <div style="display: flex; gap: 5px;">
      <button onclick="addEvent('dialogue')" class="btn-secondary">+ DIALOGO</button>
      <button onclick="addEvent('move')" class="btn-secondary">+ MOVIMENTO</button>
    </div>
  </div>

  <!-- ANTEPRIMA STAGE 400x300 -->
  <div id="preview-container">
    <h2>CANVAS 1:1 (400x300)</h2>
    <div id="stage"></div>
    <div style="margin-top: 10px; font-size: 11px; color: #aaa;">
      Trascina i personaggi all'interno dello schermo per impostare la posizione iniziale.
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://tssgkiytaxmcrodrcrpu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_3JHORvzXFoBh7XVVuSqgTg__ezQdQMa';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let cutsceneData = {
      background: "",
      music: "",
      actors: [
        { id: "hero", name: "Giocatore", asset: "", pos: [176, 126] }
      ],
      events: [
        { id: 1, type: "dialogue", speaker: "SISTEMA", text: "Benvenuto nel giorno [nome]!", start: 0, duration: 3 }
      ]
    };

    let activeDragActor = null;
    let dragOffsetX = 0;
    let dragOffsetY = 0;

    function initEditor() {
      renderStage();
      renderActorsControls();
      renderEventsControls();
    }

    function updateStageConfig() {
      cutsceneData.background = document.getElementById('cfg-bg').value.trim();
      cutsceneData.music = document.getElementById('cfg-music').value.trim();
      renderStage();
    }

    function renderStage() {
      const stage = document.getElementById('stage');
      stage.innerHTML = '';

      if (cutsceneData.background) {
        stage.style.backgroundImage = `url('${SUPABASE_URL}/storage/v1/object/public/assets/${cutsceneData.background}')`;
      } else {
        stage.style.backgroundImage = 'none';
      }

      cutsceneData.actors.forEach(actor => {
        const el = document.createElement('div');
        el.className = 'editor-actor';
        el.style.left = `${actor.pos[0]}px`;
        el.style.top = `${actor.pos[1]}px`;

        const label = document.createElement('div');
        label.className = 'actor-label';
        label.innerText = actor.name;
        el.appendChild(label);

        if (actor.asset) {
          const img = document.createElement('img');
          img.src = `${SUPABASE_URL}/storage/v1/object/public/assets/${actor.asset}`;
          img.style.width = '100%';
          img.style.height = '100%';
          el.appendChild(img);
        } else {
          el.style.background = '#306230';
        }

        el.addEventListener('mousedown', (e) => {
          activeDragActor = actor;
          dragOffsetX = e.clientX - actor.pos[0];
          dragOffsetY = e.clientY - actor.pos[1];
        });

        stage.appendChild(el);
      });
    }

    document.addEventListener('mousemove', (e) => {
      if (!activeDragActor) return;
      const stageRect = document.getElementById('stage').getBoundingClientRect();
      
      let newX = e.clientX - dragOffsetX;
      let newY = e.clientY - dragOffsetY;

      newX = Math.max(0, Math.min(352, newX));
      newY = Math.max(0, Math.min(252, newY));

      activeDragActor.pos[0] = Math.round(newX);
      activeDragActor.pos[1] = Math.round(newY);

      renderStage();
      renderActorsControls();
    });

    document.addEventListener('mouseup', () => {
      activeDragActor = null;
    });

    function renderActorsControls() {
      const container = document.getElementById('actors-list');
      container.innerHTML = '';

      cutsceneData.actors.forEach((actor, index) => {
        const div = document.createElement('div');
        div.className = 'event-card';
        div.innerHTML = `
          <button class="remove-btn btn-danger" onclick="removeActor(${index})">X</button>
          <label>NOME PERSONAGGIO:</label>
          <input type="text" value="${actor.name}" onchange="cutsceneData.actors[${index}].name = this.value; renderStage();">
          <label>FILE SPRITE (es. hero.png):</label>
          <input type="text" value="${actor.asset}" placeholder="Vuoto = Avatar utente" onchange="cutsceneData.actors[${index}].asset = this.value; renderStage();">
          <div style="font-size: 10px; margin-top: 4px; color: #9bbc0f;">POSIZIONE X: ${actor.pos[0]}px | Y: ${actor.pos[1]}px</div>
        `;
        container.appendChild(div);
      });
    }

    function addActor() {
      cutsceneData.actors.push({
        id: 'actor_' + Date.now(),
        name: 'Nuovo Attore',
        asset: '',
        pos: [100, 100]
      });
      renderStage();
      renderActorsControls();
    }

    function removeActor(index) {
      cutsceneData.actors.splice(index, 1);
      renderStage();
      renderActorsControls();
    }

    function renderEventsControls() {
      const container = document.getElementById('events-list');
      container.innerHTML = '';

      cutsceneData.events.forEach((ev, index) => {
        const div = document.createElement('div');
        div.className = 'event-card';

        let innerHTML = `<button class="remove-btn btn-danger" onclick="removeEvent(${index})">X</button>`;
        innerHTML += `<div style="font-weight: bold; font-size: 11px; color: #9bbc0f;">TIPO: ${ev.type.toUpperCase()}</div>`;
        
        innerHTML += `
          <div style="display: flex; gap: 5px;">
            <div>
              <label>INIZIO (sec):</label>
              <input type="number" step="0.5" value="${ev.start}" onchange="cutsceneData.events[${index}].start = parseFloat(this.value);">
            </div>
            <div>
              <label>DURATA (sec):</label>
              <input type="number" step="0.5" value="${ev.duration}" onchange="cutsceneData.events[${index}].duration = parseFloat(this.value);">
            </div>
          </div>
        `;

        if (ev.type === 'dialogue') {
          innerHTML += `
            <label>NOME PARLANTE:</label>
            <input type="text" value="${ev.speaker || ''}" onchange="cutsceneData.events[${index}].speaker = this.value;">
            <label>TESTO DIALOGO:</label>
            <input type="text" value="${ev.text || ''}" onchange="cutsceneData.events[${index}].text = this.value;">
          `;
        } else if (ev.type === 'move') {
          innerHTML += `
            <label>ATTORE:</label>
            <input type="text" value="${ev.actor || ''}" placeholder="Nome dell'attore" onchange="cutsceneData.events[${index}].actor = this.value;">
            <div style="display: flex; gap: 5px;">
              <div>
                <label>DA X,Y:</label>
                <input type="text" value="${ev.from ? ev.from.join(',') : '0,0'}" onchange="cutsceneData.events[${index}].from = this.value.split(',').map(Number);">
              </div>
              <div>
                <label>A X,Y:</label>
                <input type="text" value="${ev.to ? ev.to.join(',') : '100,100'}" onchange="cutsceneData.events[${index}].to = this.value.split(',').map(Number);">
              </div>
            </div>
          `;
        }

        div.innerHTML = innerHTML;
        container.appendChild(div);
      });
    }

    function addEvent(type) {
      const newEv = {
        id: Date.now(),
        type: type,
        start: 0,
        duration: 2
      };

      if (type === 'dialogue') {
        newEv.speaker = 'NARRATORE';
        newEv.text = 'Inserisci testo qui...';
      } else if (type === 'move') {
        newEv.actor = cutsceneData.actors[0] ? cutsceneData.actors[0].name : 'Giocatore';
        newEv.from = [50, 50];
        newEv.to = [150, 150];
      }

      cutsceneData.events.push(newEv);
      renderEventsControls();
    }

    function removeEvent(index) {
      cutsceneData.events.splice(index, 1);
      renderEventsControls();
    }

    // SALVATAGGIO CON RICHIESTA DEL SOLO NUMERO DEL GIORNO
    async function saveCutscene() {
      const dayNumber = prompt("Inserisci solo il numero del giorno (es. 1 per giorno1.json, 5 per giorno5.json):");
      if (!dayNumber) return;

      const cleanDay = dayNumber.trim();
      const fileName = `cutscenes/giorno${cleanDay}.json`;
      const jsonContent = JSON.stringify(cutsceneData, null, 2);
      const blob = new Blob([jsonContent], { type: 'application/json' });

      try {
        const { error } = await _supabase.storage
          .from('assets')
          .upload(fileName, blob, { 
            upsert: true,
            cacheControl: '0'
          });

        if (error) throw error;
        alert(`Cutscene salvata con successo su Supabase come ${fileName}!`);
      } catch(e) {
        alert("Errore nel salvataggio: " + e.message);
      }
    }

    initEditor();
  </script>
</body>
</html>
