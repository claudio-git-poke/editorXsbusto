<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cutscene Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg: #121212; --panel: #1e1e1e; --accent: #007acc; --border: #333; --text: #fff; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 20px; }
    h1, h3 { margin-top: 0; }
    .grid { display: grid; grid-template-columns: 360px 1fr; gap: 20px; }
    .panel { background: var(--panel); padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
    .field { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.85em; color: #aaa; }
    select, input, button { padding: 8px; background: #2a2a2a; color: var(--text); border: 1px solid #444; border-radius: 4px; }
    button { cursor: pointer; background: var(--accent); font-weight: bold; border: none; }
    button:hover { opacity: 0.9; }
    .btn-success { background: #28a745; }
    .btn-warning { background: #e67e22; width: 100%; margin-top: 10px; }
    .track { display: flex; flex-direction: column; gap: 8px; background: #2a2a2a; padding: 10px; border-radius: 4px; min-height: 100px; }
    .block { background: #333; border-left: 4px solid var(--accent); padding: 10px; border-radius: 4px; cursor: grab; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

  <h1>Cutscene Studio</h1>

  <div class="grid">
    <div>
      <div class="panel">
        <h3>1. Setup Asset della Scena</h3>
        
        <div class="field">
          <label>Sfondo:</label>
          <select id="select-bg"></select>
        </div>

        <div class="field">
          <label>Musica:</label>
          <select id="select-music"></select>
        </div>

        <div class="field">
          <label>Personaggio Principale (Cartella):</label>
          <select id="select-hero"></select>
        </div>

        <div class="field">
          <label>PNG / NPC (Cartella):</label>
          <select id="select-npc"></select>
        </div>

        <div class="field">
          <label>Companion (Cartella):</label>
          <select id="select-companion"></select>
        </div>
      </div>

      <div class="panel">
        <h3>2. Aggiungi Dialogo</h3>
        <div class="field">
          <label>Chi Parla:</label>
          <select id="dialogue-speaker">
            <option value="main_character">Personaggio Principale</option>
            <option value="png">PNG / NPC</option>
            <option value="companion">Companion</option>
          </select>
        </div>
        <div class="field">
          <label>Testo Dialogo:</label>
          <input type="text" id="dialogue-text" placeholder="Scrivi il testo...">
        </div>
        <button class="btn-success" onclick="addDialogue()">+ Aggiungi a Timeline</button>
      </div>

      <div class="panel">
        <h3>3. Carica Nuovo File Asset</h3>
        <div class="field">
          <label>Sottocartella Destinazione (es: sprite/png/rosso):</label>
          <input type="text" id="upload-folder" placeholder="sprite/png/rosso">
        </div>
        <div class="field">
          <input type="file" id="upload-file">
        </div>
        <button onclick="uploadAsset()">Carica su Supabase</button>
      </div>
    </div>

    <div>
      <div class="panel">
        <h3>Timeline Sequenza (Trascina per riordinare)</h3>
        <div id="timeline-track" class="track"></div>
        <button class="btn-warning" onclick="exportJSON()">💾 Scarica Cutscene JSON</button>
      </div>
    </div>
  </div>

  <script>
    // Dati di connessione a Supabase preconfigurati
    const SUPABASE_URL = "https://tssgkiytaxmcrodrcrpu.supabase.co";
    const SUPABASE_KEY = "sb_publishable_3JHORvzXFoBh7XVVuSqgTg__ezQdQMa";

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const timeline = [];

    window.onload = () => {
      loadAssets();
    };

    async function loadAssets() {
      const allFiles = await fetchAllAssets('');
      
      const bgs = allFiles.filter(f => f.startsWith('background/'));
      const music = allFiles.filter(f => f.startsWith('music/'));
      
      const heroes = extractFolders(allFiles, 'sprite/personaggioprincipale/');
      const npcs = extractFolders(allFiles, 'sprite/png/');
      const companions = extractFolders(allFiles, 'sprite/companion/');

      populateSelect('select-bg', bgs);
      populateSelect('select-music', music);
      populateSelect('select-hero', heroes);
      populateSelect('select-npc', npcs);
      populateSelect('select-companion', companions);
    }

    async function fetchAllAssets(folder) {
      const { data, error } = await _supabase.storage.from('assets').list(folder);
      if (error || !data) return [];

      let files = [];
      for (const item of data) {
        const path = folder ? `${folder}/${item.name}` : item.name;
        if (!item.id) { 
          const subFiles = await fetchAllAssets(path);
          files = files.concat(subFiles);
        } else {
          files.push(path);
        }
      }
      return files;
    }

    function extractFolders(files, prefix) {
      const folders = new Set();
      files.filter(f => f.startsWith(prefix)).forEach(f => {
        const relative = f.replace(prefix, '');
        const parts = relative.split('/');
        if (parts.length > 1) folders.add(parts[0]);
      });
      return Array.from(folders);
    }

    function populateSelect(id, items) {
      const select = document.getElementById(id);
      select.innerHTML = items.map(i => `<option value="${i}">${i}</option>`).join('');
    }

    function addDialogue() {
      const speaker = document.getElementById('dialogue-speaker').value;
      const text = document.getElementById('dialogue-text').value.trim();
      if (!text) return alert("Inserisci un testo!");

      timeline.push({ type: 'dialogue', speaker, text });
      document.getElementById('dialogue-text').value = '';
      renderTimeline();
    }

    function renderTimeline() {
      const container = document.getElementById('timeline-track');
      container.innerHTML = '';

      timeline.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'block';
        div.draggable = true;
        div.innerHTML = `<span><b>${index + 1}.</b> [${item.speaker}]: "${item.text}"</span>`;

        div.ondragstart = (e) => e.dataTransfer.setData('text/plain', index);
        div.ondragover = (e) => e.preventDefault();
        div.ondrop = (e) => {
          e.preventDefault();
          const fromIndex = e.dataTransfer.getData('text/plain');
          const moved = timeline.splice(fromIndex, 1)[0];
          timeline.splice(index, 0, moved);
          renderTimeline();
        };

        container.appendChild(div);
      });
    }

    async function uploadAsset() {
      const folder = document.getElementById('upload-folder').value.trim();
      const fileInput = document.getElementById('upload-file');
      const file = fileInput.files[0];

      if (!folder || !file) return alert("Inserisci la cartella e seleziona un file!");

      const fullPath = `${folder}/${file.name}`.replace(/\/+/g, '/');
      const { error } = await _supabase.storage.from('assets').upload(fullPath, file, { upsert: true });

      if (error) alert("Errore: " + error.message);
      else {
        alert("File caricato in: " + fullPath);
        loadAssets();
      }
    }

    function exportJSON() {
      const hero = document.getElementById('select-hero').value;
      const npc = document.getElementById('select-npc').value;
      const companion = document.getElementById('select-companion').value;

      const output = {
        setup: {
          background: document.getElementById('select-bg').value || "background/trama1/fallback.png",
          background_fallback: "background/trama1/fallback.png",
          music: document.getElementById('select-music').value || "music/fallback.mp3",
          music_fallback: "music/fallback.mp3",
          main_character: {
            folder: hero ? `sprite/personaggioprincipale/${hero}/` : "sprite/personaggioprincipale/fallback/",
            fallback_folder: "sprite/personaggioprincipale/fallback/"
          },
          png: {
            folder: npc ? `sprite/png/${npc}/` : "sprite/png/default/",
            fallback_folder: "sprite/png/default/"
          },
          companion: {
            folder: companion ? `sprite/companion/${companion}/` : "sprite/companion/fallback/",
            fallback_folder: "sprite/companion/fallback/"
          }
        },
        timeline: timeline
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(output, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = "cutscene_daily.json";
      a.click();
    }
  </script>
</body>
</html>
