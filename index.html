<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cutscene Studio Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg: #0f111a; --panel: #1a1d2d; --accent: #7c3aed; --border: #2e334d; --text: #f3f4f6; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 20px; }
    h1, h3 { margin-top: 0; color: #fff; }
    .grid { display: grid; grid-template-columns: 360px 1fr; gap: 20px; }
    .panel { background: var(--panel); padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
    .field { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.8em; color: #9ca3af; }
    input, button, select { padding: 8px; background: #252a41; color: var(--text); border: 1px solid var(--border); border-radius: 4px; }
    button { cursor: pointer; background: var(--accent); font-weight: bold; border: none; }
    button:hover { opacity: 0.9; }
    .btn-select { background: #252a41; border: 1px dashed #4b5563; text-align: left; }
    .btn-success { background: #10b981; }

    #auth-screen { max-width: 400px; margin: 80px auto; }
    
    .stage-container { position: relative; width: 100%; height: 360px; background: #000; border: 2px solid var(--border); border-radius: 8px; overflow: hidden; background-size: cover; background-position: center; margin-bottom: 20px; }
    .draggable-actor { position: absolute; width: 64px; height: 64px; cursor: move; user-select: none; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; transition: transform 0.05s linear; }
    .draggable-actor img { max-width: 100%; max-height: 100%; pointer-events: none; image-rendering: pixelated; }
    .actor-label { font-size: 10px; background: rgba(0,0,0,0.7); padding: 2px 4px; border-radius: 3px; margin-top: 2px; }

    #dialogue-overlay { display: none; position: absolute; bottom: 10px; left: 10px; right: 10px; background: rgba(0,0,0,0.9); border: 2px solid #fff; border-radius: 6px; padding: 12px; color: #fff; z-index: 100; pointer-events: none; }
    #dialogue-overlay .speaker { font-weight: bold; color: #f59e0b; margin-bottom: 4px; }

    .timeline-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .timeline-wrapper { background: #131625; border: 1px solid var(--border); border-radius: 6px; padding: 10px; position: relative; overflow-x: auto; user-select: none; }
    .timeline-ruler { display: flex; border-bottom: 1px solid var(--border); padding-bottom: 5px; font-size: 11px; color: #6b7280; }
    .ruler-mark { flex: 1; border-left: 1px solid #2e334d; padding-left: 4px; min-width: 60px; }
    .timeline-tracks { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; min-height: 120px; width: 100%; }
    
    .track-row { position: relative; height: 36px; background: rgba(255,255,255,0.02); border-radius: 4px; width: 100%; display: flex; align-items: center; }
    .track-label { width: 100px; font-size: 11px; font-weight: bold; padding-left: 8px; color: #a7f3d0; border-right: 1px solid var(--border); text-overflow: ellipsis; overflow: hidden; white-space: nowrap; flex-shrink: 0; }
    .track-content { position: relative; flex: 1; height: 100%; }

    .timeline-block { position: absolute; height: 28px; top: 4px; background: #a855f7; border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: bold; color: #fff; cursor: pointer; display: flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; }
    .timeline-block.actor-track { background: #10b981; }
    .timeline-block.dialogue { background: #f59e0b; }
    .timeline-block.move { background: #3b82f6; }

    .resizer { position: absolute; top: 0; width: 8px; height: 100%; cursor: e-resize; background: rgba(0,0,0,0.3); }
    .resizer.right { right: 0; border-radius: 0 4px 4px 0; }
    .resizer.left { left: 0; border-radius: 4px 0 0 4px; }
    
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 1000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
    .modal-content { background: var(--panel); border-radius: 8px; padding: 20px; max-width: 900px; margin: 0 auto; border: 1px solid var(--border); }
    .asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
    .asset-card { background: #252a41; border: 1px solid var(--border); border-radius: 6px; padding: 10px; text-align: center; cursor: pointer; }
    .asset-card img { max-width: 100%; height: 70px; object-fit: contain; image-rendering: pixelated; }
  </style>
</head>
<body>

  <div id="auth-screen" class="panel">
    <h3>Login Cutscene Studio</h3>
    <div id="auth-logged" style="display:none;">
      <p id="user-info"></p>
      <button class="btn-success" style="width:100%" onclick="enterEditor()">Entra nell'Editor</button>
    </div>
    <div id="auth-form">
      <div class="field"><label>Email:</label><input type="email" id="auth-email"></div>
      <div class="field"><label>Password:</label><input type="password" id="auth-password"></div>
      <button style="width:100%" onclick="login()">Accedi</button>
    </div>
  </div>

  <div id="editor-screen" style="display:none;">
    <h1>Cutscene Studio Pro</h1>

    <div class="panel" style="display:flex; gap:10px;">
      <button style="background:#3b82f6;" onclick="loadCutsceneFromSupabase()">☁️ Carica da Supabase</button>
      <button style="background:#8b5cf6;" onclick="document.getElementById('import-json-file').click()">📂 Importa JSON</button>
      <input type="file" id="import-json-file" style="display:none;" accept=".json" onchange="importLocalJSON(event)">
    </div>

    <div class="grid">
      <div>
        <div class="panel">
          <h3>1. Ambiente Scena</h3>
          <div class="field">
            <label>Sfondo Scena:</label>
            <button class="btn-select" id="lbl-bg" onclick="openPicker('background')">📁 Seleziona Sfondo...</button>
          </div>
          <div class="field">
            <label>Musica:</label>
            <button class="btn-select" id="lbl-music" onclick="openPicker('music')">📁 Seleziona Musica...</button>
          </div>

          <hr style="border-color:var(--border); margin:15px 0;">

          <h3>2. Aggiungi Personaggio</h3>
          <div class="field">
            <label>Tipo:</label>
            <select id="new-actor-type">
              <option value="png">PNG / NPC</option>
              <option value="companion">Companion</option>
            </select>
          </div>
          <div class="field">
            <label>Nome Personaggio:</label>
            <input type="text" id="new-actor-name" placeholder="Es. Guardia 1, Companion Rex...">
          </div>

          <div class="field">
            <label>Comportamento Iniziale:</label>
            <select id="new-actor-behavior" onchange="toggleActorBehaviorInputs()">
              <option value="static">Resta Fermo</option>
              <option value="move">Muoviti</option>
            </select>
          </div>

          <div id="actor-move-inputs" style="display:none;">
            <button type="button" style="background:#8b5cf6; margin-bottom:8px; width:100%;" onclick="startClickMovement(true)">🖱 Seleziona Posizione Finale su Stage</button>
            <div style="display:flex; gap:5px;">
              <input type="number" id="actor-end-x" placeholder="Destinazione X">
              <input type="number" id="actor-end-y" placeholder="Destinazione Y">
            </div>
          </div>

          <button class="btn-select" style="margin-top:10px;" id="lbl-new-actor-asset" onclick="openPickerForNewActor()">📁 Scegli Asset e Aggiungi ➔</button>
        </div>

        <div class="panel">
          <h3>3. Evento Dialogo</h3>
          <div class="field">
            <label>Chi Parla:</label>
            <select id="dialogue-speaker"></select>
          </div>
          <div class="field">
            <label>Testo Dialogo:</label>
            <input type="text" id="event-text" placeholder="Messaggio...">
          </div>
          <div class="field">
            <label>Tempo Inizio (s):</label>
            <input type="number" id="event-start" value="0" step="0.5">
          </div>
          <div class="field">
            <label>Durata (s):</label>
            <input type="number" id="event-duration" value="2" step="0.5">
          </div>
          <button class="btn-success" onclick="addDialogueEvent()">+ Aggiungi Dialogo</button>
        </div>
      </div>

      <div>
        <div id="stage" class="stage-container" onclick="handleStageGlobalClick(event)">
          <div id="dialogue-overlay">
            <div class="speaker" id="dialogue-speaker-name">Speaker</div>
            <div class="text" id="dialogue-text-content">...</div>
          </div>
        </div>

        <div class="panel">
          <div class="timeline-header">
            <h3>Timeline Entità & Eventi <span id="time-display">0.0 / 10.0 s</span></h3>
            <div>
              <button style="background:#2563eb;" onclick="startPreview()">▶ Riproduci</button>
              <button style="background:#dc2626;" onclick="stopPreview()">⏹ Stop</button>
            </div>
          </div>

          <div class="timeline-wrapper" id="timeline-wrapper">
            <div class="timeline-ruler">
              <div class="ruler-mark">0s</div>
              <div
